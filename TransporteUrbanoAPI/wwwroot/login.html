<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Transporte Urbano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="card-head">
        <span class="brand-logo" data-icon="bus" style="margin-bottom:1rem"></span>
        <h3 style="font-size:26px">Iniciar sesión</h3>
        <p>Ingresá con tu usuario del sistema.</p>
      </div>
      <div class="card-body">
          <form id="loginForm" class="form-stack">
              <div class="input-box">
                  <input class="input" id="usuario" placeholder=" " autocomplete="username" required autofocus>
                  <label for="usuario">Usuario o Email</label>
              </div>
              <div class="input-box">
                  <input class="input" id="password" type="password" placeholder=" " autocomplete="current-password" required>
                  <label for="password">Contraseña</label>
              </div>
              <p class="form-error" id="error" role="alert"></p>
              <button class="btn" id="btnLogin" type="submit">Ingresar</button>
          </form>
          <p style="margin-top:1rem;text-align:center;font-weight:500">¿No tenés cuenta? <a href="registro.html" style="text-decoration:underline;font-weight:700">Registrate</a></p>
          <p class="muted" style="font-size:13px;margin-top:1rem;text-align:center">Usuario de prueba: admin / admin123</p>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>document.querySelectorAll("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon)));</script>
  <script src="js/login.js"></script>
</body>
</html>
