<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - Transporte Urbano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-wrap">
        <div class="card login-card">
            <div class="card-head">
                <span class="brand-logo" data-icon="bus" style="margin-bottom:1rem"></span>
                <h3 style="font-size:26px">Crear cuenta</h3>
                <p>Registrate para conocer el proyecto.</p>
            </div>
            <div class="card-body">
                <form id="registroForm" class="form-stack">
                    <div class="input-box">
                        <input class="input" id="usuario" placeholder=" " autocomplete="username" minlength="3" maxlength="50" required autofocus>
                        <label for="usuario">Nombre de usuario</label>
                    </div>
                    <div class="input-box">
                        <input class="input" id="email" type="email" placeholder=" " autocomplete="email" maxlength="100" required>
                        <label for="email">Email</label>
                    </div>
                    <div class="input-box">
                        <input class="input" id="password" type="password" placeholder=" " autocomplete="new-password" minlength="6" required>
                        <label for="password">Contraseña (mínimo 6)</label>
                    </div>
                    <div class="input-box">
                        <input class="input" id="password2" type="password" placeholder=" " autocomplete="new-password" required>
                        <label for="password2">Repetir contraseña</label>
                    </div>
                    <p class="form-error" id="error" role="alert"></p>
                    <button class="btn" id="btnRegistro" type="submit">Crear cuenta</button>
                </form>
                <p style="margin-top:1rem;text-align:center;font-weight:500">¿Ya tenés cuenta? <a href="login.html" style="text-decoration:underline;font-weight:700">Iniciá sesión</a></p>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>document.querySelectorAll("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon)));</script>
    <script src="js/registro.js"></script>
</body>
</html>
